plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spstudio.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.spstudio.pro"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // اسم مستودع GitHub المستخدم للتحقق من التحديثات عبر Releases API
        buildConfigField "String", "GITHUB_OWNER", '"your-github-username"'
        buildConfigField "String", "GITHUB_REPO", '"PT-semo-android"'
    }

    signingConfigs {
        release {
            // يُفعَّل هذا التوقيع تلقائياً فقط عند توفر متغيرات البيئة التالية
            // (تُمرَّر من أسرار GitHub Actions عند إعداد إصدار موقّع رسمياً).
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
}
