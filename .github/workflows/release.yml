name: Build and Release APK

# يعمل هذا السير تلقائياً عند دفع وسم إصدار مثل v1.0.0،
# أو يدوياً من تبويب Actions عبر workflow_dispatch.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # المشروع لا يتضمن ملفات gradlew/gradlew.bat الثنائية، لذا يقوم هذا
      # الإجراء الرسمي بتثبيت Gradle نفسه وإتاحته كأمر "gradle" مباشرة،
      # بدلاً من الاعتماد على غلاف (wrapper) غير موجود في المستودع.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD_SECRET: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD_SECRET: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "🔐 تم العثور على أسرار التوقيع، سيتم بناء APK موقّع"
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "RELEASE_STORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "ℹ️ لا توجد أسرار توقيع، سيتم بناء APK غير موقّع (صالح للاختبار فقط)"
          fi

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "لم يتم العثور على ملف APK بعد البناء" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sp-studio-pro-release
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
